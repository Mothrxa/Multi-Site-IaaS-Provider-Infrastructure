username admin secret admin
!
interface Ethernet1
   no switchport
   ip address 10.0.255.30/30
!
interface Ethernet2
   no switchport
   ip address 10.10.10.1 255.255.255.0
   ip helper-address 10.0.40.2
!
ip routing
!
router ospf 1
  router-id 10.0.0.8
  network 10.10.10.0 0.0.0.255 area 0.0.0.1
  passive-interface Ethernet 0
!
interface Ethernet1
   ip ospf area 0.0.0.1
   ip ospf network point-to-point
!
interface Ethernet2
   ip ospf area 0.0.0.1
!
