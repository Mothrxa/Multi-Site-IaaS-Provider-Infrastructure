username admin secret admin
!
interface Ethernet1
   no switchport
   ip address 10.0.255.22/30
!
interface Ethernet2
   no switchport
   ip address 10.0.255.25/30
!
ip routing
!
router ospf 1
   router-id 10.0.0.7
   passive-interface Ethernet 0
!
interface Ethernet1
   ip ospf network point-to-point
   ip ospf area 0.0.0.1
!
interface Ethernet2
   ip ospf network point-to-point
   ip ospf area 0.0.0.1
!