
# ============================================================
# FreeRADIUS – PostgreSQL Backend Setup
# ============================================================

# -- Step 1: Enable the SQL module --
sudo ln -s /etc/freeradius/3.0/mods-available/sql /etc/freeradius/3.0/mods-enabled/

# -- Step 2: Create the RADIUS database and user in PostgreSQL --
sudo -u postgres psql <<EOF
CREATE DATABASE radius;
CREATE USER radius WITH PASSWORD <PASSWORD>;
GRANT ALL PRIVILEGES ON DATABASE radius TO radius;
EOF

# -- Step 3: Import the FreeRADIUS SQL schema --
sudo -u postgres psql radius < /etc/freeradius/3.0/mods-config/sql/main/postgresql/schema.sql