-- /etc/dhcp/dhcpd.conf --
#Configuration file for ISC dhcpd
key "dhcp-key" {
	algorithm hmac-sha256;
	secret "edcJKooRzYDqeAkfVU9+SaJMxA5VQt6SYf3fyfZefpY=";
};

ddns-update-style interim;
ignore client-updates;

ddns-domainname "pfe2627.xyz.";
ddns-rev-domainname "in-addr.arpa.";

zone pfe2627.xyz. {
    primary 10.0.40.5;
    key dhcp-key;
}

zone 10.0.10.in-addr.arpa. {
    primary 10.0.40.5;
    key dhcp-key;
}

zone 10.0.20.in-addr.arpa. {
    primary 10.0.40.5;
    key dhcp-key;
}

zone 10.0.30.in-addr.arpa. {
    primary 10.0.40.5;
    key dhcp-key;
}

zone 10.0.40.in-addr.arpa. {
    primary 10.0.40.5;
    key dhcp-key;
}

option domain-name-servers 10.0.40.5;
option domain-name "pfe2627.xyz";

default-lease-time 600;
max-lease-time 7200;

subnet 10.0.10.0 netmask 255.255.255.240 {
  range 10.0.10.4 10.0.10.14;
  option domain-name-servers 10.0.40.5;
  option domain-name "pfe2627.xyz";
  option subnet-mask 255.255.255.240;
  option routers 10.0.10.1;
  option broadcast-address 10.0.10.15;
  default-lease-time 600;
  max-lease-time 7200;
}

subnet 10.0.20.0 netmask 255.255.255.240 {
  range 10.0.20.4 10.0.20.14;
  option domain-name-servers 10.0.40.5;
  option domain-name "pfe2627.xyz";
  option subnet-mask 255.255.255.240;
  option routers 10.0.20.1;
  option broadcast-address 10.0.20.15;
  default-lease-time 600;
  max-lease-time 7200;
}

subnet 10.0.30.0 netmask 255.255.255.240 {
  range 10.0.30.4 10.0.30.14;
  option domain-name-servers 10.0.40.5;
  option domain-name "pfe2627.xyz";
  option subnet-mask 255.255.255.240;
  option routers 10.0.30.1;
  option broadcast-address 10.0.30.15;
  default-lease-time 600;
  max-lease-time 7200;
}

subnet 10.0.40.0 netmask 255.255.255.240 {
  option routers 10.0.40.1;
  option domain-name-servers 10.0.40.5;
  option domain-name "pfe2627.xyz";
  option subnet-mask 255.255.255.240;
  option broadcast-address 10.0.40.15;
}

