-- /etc/dovecot/conf.d/10-master.conf --
# Master process configuration for Dovecot IMAP service
service imap-login {
  inet_listener imap {}
  inet_listener imaps {}
}

service pop3-login {
  inet_listener pop3 {}
  inet_listener pop3s {}
}

service submission-login {
  inet_listener submission {}
  inet_listener submissions {}
}

service lmtp { unix_listener lmtp {} }

service imap {}

service pop3 {}

service submission {}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service auth-worker {}

service dict { unix_listener dict {} }
