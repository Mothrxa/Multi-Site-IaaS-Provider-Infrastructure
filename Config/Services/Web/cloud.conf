# /etc/nginx/sites-enabled/cloud.conf
# STRATA Cloud — portal app (login/signup/dashboard), port 8000
server {
    listen 8000;
    server_name _;

    root /var/www/cloud;
    index index.html;

    # API → Node/Express backend (pm2: cloud-backend, port 4001)
    location /api/ {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — serve static files, fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
